# ===================================================================
# College Canteen Food Ordering System - Application Configuration
# ===================================================================

spring.application.name=canteen-backend
server.port=${PORT:8080}

# ===================================================================
# MySQL 8 DATABASE CONFIGURATION (Local + Cloud dynamic support)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/canteen_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root@123}

# ===================================================================
# JPA & Hibernate for MySQL 8
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# JWT & Security Configuration
# ===================================================================
app.jwt.secret=${APP_JWT_SECRET:canteenSecretKeyForCollegeFoodOrderingSystem2026SecureKeyWith256BitsMinimumLength}
app.jwt.expiration-ms=86400000

# ===================================================================
# CORS Configuration (Vite React Frontend + Cloud URLs)
# ===================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://*,http://*}

